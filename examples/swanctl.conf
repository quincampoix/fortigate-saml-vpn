connections {
    fortigate {
        version = 2
        rekey_time = 86400s

        # Replace with your FortiGate VPN gateway
        remote_addrs = vpn.example.com

        local {
            auth = eap

            # Local IKE identity expected by the FortiGate
            id = vpn-client
        }

        remote {
            auth = psk
        }

        proposals = aes256-sha256-ecp384

        vips = 0.0.0.0
        fragmentation = yes
        mobike = no
        dpd_delay = 20s

        children {
            fortigate {
                local_ts = dynamic
                remote_ts = 0.0.0.0/0
                esp_proposals = aes256-sha256-ecp384
                rekey_time = 43200s
                life_time = 46800s
                dpd_action = clear
            }
        }
    }
}

secrets {
    ike-fortigate {
        # Must match the identity used for the IKE pre-shared key
        id = REPLACE_WITH_PSK_ID
        # Never commit your actual PSK to Git
        secret = "REPLACE_WITH_YOUR_IKE_PRESHARED_KEY"
    }
}